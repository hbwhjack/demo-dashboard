<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コネクター</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="left"><span class="logo"></span><strong>Codex</strong></div>
    <div class="right"><span>設定</span><span>ドキュメント</span><span class="pill">PLUS</span></div>
  </div>

  <div class="notice">GitHub アカウントが接続されていません。今すぐ接続してください。</div>

  <div class="layout">
    <aside class="sidebar">
      <h3>設定</h3>
      <div class="nav">
        <a class="item" href="general.html">一般</a>
        <a class="item" href="environment.html">環境</a>
        <a class="item" href="code-review.html">コードレビュー</a>
        <a class="item active" href="connectors.html">コネクター</a>
        <a class="item" href="index.html">使用状況</a>
        <a class="item" href="data-control.html">データ コントロール</a>
      </div>
    </aside>

    <main class="content">
      <h2>コネクター</h2>
      <div class="divider"></div>
      <div class="save-status" id="saveStatus">設定を読み込み中...</div>
      <div class="grid-2">
        <div class="card">
          <h4>連携サービス</h4>
          <div class="list">
            <div class="setting-row">
              <label for="githubStatus">GitHub</label>
              <select id="githubStatus" data-setting-key="connectors.github" data-default="disconnected">
                <option value="connected">接続済み</option>
                <option value="disconnected">未接続</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="slackStatus">Slack</label>
              <select id="slackStatus" data-setting-key="connectors.slack" data-default="connected">
                <option value="connected">接続済み</option>
                <option value="disconnected">未接続</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="jiraStatus">Jira</label>
              <select id="jiraStatus" data-setting-key="connectors.jira" data-default="disconnected">
                <option value="connected">接続済み</option>
                <option value="disconnected">未接続</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card">
          <h4>自動化</h4>
          <div class="list">
            <div class="setting-row">
              <label>PR自動要約</label>
              <div class="toggle">
                <input type="checkbox" data-setting-key="automation.prSummary" data-default="true" />
                <span>ON</span>
              </div>
            </div>
            <div class="setting-row">
              <label>Issueラベル</label>
              <div class="toggle">
                <input type="checkbox" data-setting-key="automation.issueLabels" data-default="true" />
                <span>ON</span>
              </div>
            </div>
            <div class="setting-row">
              <label for="notifyChannel">通知チャンネル</label>
              <input id="notifyChannel" type="text" data-setting-key="automation.notifyChannel" data-default="#dev" />
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
