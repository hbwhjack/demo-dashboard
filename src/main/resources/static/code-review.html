<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>コードレビュー</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="left"><span class="logo"></span><strong>Codex</strong></div>
    <div class="right"><span>設定</span><span>ドキュメント</span><span class="pill">PLUS</span></div>
  </div>

  <div class="notice">GitHub アカウントが接続されていません。今すぐ接続してください。</div>

  <div class="layout">
    <aside class="sidebar">
      <h3>設定</h3>
      <div class="nav">
        <a class="item" href="general.html">一般</a>
        <a class="item" href="environment.html">環境</a>
        <a class="item active" href="code-review.html">コードレビュー</a>
        <a class="item" href="connectors.html">コネクター</a>
        <a class="item" href="index.html">使用状況</a>
        <a class="item" href="data-control.html">データ コントロール</a>
      </div>
    </aside>

    <main class="content">
      <h2>コードレビュー</h2>
      <div class="divider"></div>
      <div class="save-status" id="saveStatus">設定を読み込み中...</div>
      <div class="card">
        <h4>ルールセット</h4>
        <div class="list">
          <div class="setting-row">
            <label for="reviewStyle">スタイル</label>
            <select id="reviewStyle" data-setting-key="review.style" data-default="standard-security">
              <option value="standard-security">Standard + Security</option>
              <option value="standard">Standard</option>
              <option value="security">Security</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="reviewSeverity">重要度</label>
            <select id="reviewSeverity" data-setting-key="review.severity" data-default="high">
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div class="setting-row">
            <label>自動コメント</label>
            <div class="toggle">
              <input type="checkbox" data-setting-key="review.autoComment" data-default="true" />
              <span>有効</span>
            </div>
          </div>
        </div>
      </div>
      <div class="wide">
        <div class="row">
          <div class="muted">最近のレビュー</div>
          <div class="dropdown">過去7日 ▾</div>
        </div>
        <div style="height:180px"></div>
      </div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
