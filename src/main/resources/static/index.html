<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>使用状況ダッシュボード</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="left">
      <span class="logo"></span>
      <strong>Codex</strong>
    </div>
    <div class="right">
      <span>設定</span>
      <span>ドキュメント</span>
      <span class="pill">PLUS</span>
    </div>
  </div>

  <div class="notice">GitHub アカウントが接続されていません。今すぐ接続してください。</div>

  <div class="layout">
    <aside class="sidebar">
      <h3>設定</h3>
      <div class="nav">
        <a class="item" href="general.html">一般</a>
        <a class="item" href="environment.html">環境</a>
        <a class="item" href="code-review.html">コードレビュー</a>
        <a class="item" href="connectors.html">コネクター</a>
        <a class="item active" href="index.html">使用状況</a>
        <a class="item" href="data-control.html">データ コントロール</a>
      </div>
    </aside>

    <main class="content">
      <h2>使用状況ダッシュボード</h2>
      <div class="divider"></div>
      <div class="save-status" id="saveStatus">設定を読み込み中...</div>

      <div class="section-title">残高</div>
      <div class="cards">
        <div class="card">
          <h4>5時間の使用制限</h4>
          <div class="big">
            <input type="number" min="0" max="100" data-setting-key="usage.limit5h" data-default="97" data-bar-target="limit5hBar" />% 残り
          </div>
          <div class="bar-wrap"><div class="bar" id="limit5hBar" style="width:97%"></div></div>
          <div class="sub">リセット: <input type="time" data-setting-key="usage.reset5h" data-default="14:00" /></div>
        </div>
        <div class="card">
          <h4>週あたりの使用制限</h4>
          <div class="big">
            <input type="number" min="0" max="100" data-setting-key="usage.limitWeekly" data-default="93" data-bar-target="limitWeeklyBar" />% 残り
          </div>
          <div class="bar-wrap"><div class="bar" id="limitWeeklyBar" style="width:93%"></div></div>
          <div class="sub">リセット: <input type="datetime-local" data-setting-key="usage.resetWeekly" data-default="2026-02-07T01:20" /></div>
        </div>
        <div class="card">
          <h4>コードレビュー</h4>
          <div class="big">
            <input type="number" min="0" max="100" data-setting-key="usage.reviewRemaining" data-default="100" data-bar-target="reviewRemainingBar" />% 残り
          </div>
          <div class="bar-wrap"><div class="bar" id="reviewRemainingBar" style="width:100%"></div></div>
        </div>
        <div class="card right">
          <div class="plus">＋</div>
          <h4>残りのクレジット</h4>
          <div class="big">
            <input type="number" min="0" data-setting-key="usage.credits" data-default="0" />
          </div>
          <div class="sub">クレジットを使用して、プランの上限を超えるメッセージを送信できます</div>
        </div>
      </div>

      <div class="section-title" style="margin-top:18px;">使用状況の内訳</div>
      <div class="wide">
        <div class="row">
          <div class="muted">個人の使用状況</div>
          <select class="dropdown" data-setting-key="usage.period" data-default="30">
            <option value="7">過去7日</option>
            <option value="30">30日</option>
            <option value="90">90日</option>
          </select>
        </div>
        <div style="height:220px"></div>
      </div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
