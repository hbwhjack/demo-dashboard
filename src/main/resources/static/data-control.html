<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>データ コントロール</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="left"><span class="logo"></span><strong>Codex</strong></div>
    <div class="right"><span>設定</span><span>ドキュメント</span><span class="pill">PLUS</span></div>
  </div>

  <div class="notice">GitHub アカウントが接続されていません。今すぐ接続してください。</div>

  <div class="layout">
    <aside class="sidebar">
      <h3>設定</h3>
      <div class="nav">
        <a class="item" href="general.html">一般</a>
        <a class="item" href="environment.html">環境</a>
        <a class="item" href="code-review.html">コードレビュー</a>
        <a class="item" href="connectors.html">コネクター</a>
        <a class="item" href="index.html">使用状況</a>
        <a class="item active" href="data-control.html">データ コントロール</a>
      </div>
    </aside>

    <main class="content">
      <h2>データ コントロール</h2>
      <div class="divider"></div>
      <div class="save-status" id="saveStatus">設定を読み込み中...</div>
      <div class="grid-2">
        <div class="card">
          <h4>保存</h4>
          <div class="list">
            <div class="setting-row">
              <label for="conversationDays">会話履歴 (日)</label>
              <input id="conversationDays" type="number" min="1" data-setting-key="storage.conversationDays" data-default="90" />
            </div>
            <div class="setting-row">
              <label for="logDays">ログ保存 (日)</label>
              <input id="logDays" type="number" min="1" data-setting-key="storage.logDays" data-default="30" />
            </div>
            <div class="setting-row">
              <label for="backupTime">バックアップ</label>
              <input id="backupTime" type="time" data-setting-key="storage.backupTime" data-default="02:00" />
            </div>
          </div>
        </div>
        <div class="card">
          <h4>権限</h4>
          <div class="list">
            <div class="setting-row">
              <label>個人データ共有</label>
              <div class="toggle">
                <input type="checkbox" data-setting-key="permissions.sharePersonal" data-default="false" />
                <span>許可</span>
              </div>
            </div>
            <div class="setting-row">
              <label>分析用データ</label>
              <div class="toggle">
                <input type="checkbox" data-setting-key="permissions.analytics" data-default="true" />
                <span>ON</span>
              </div>
            </div>
            <div class="setting-row">
              <label for="deletionRequest">削除リクエスト</label>
              <select id="deletionRequest" data-setting-key="permissions.deletionRequest" data-default="open">
                <option value="open">受け付け中</option>
                <option value="paused">一時停止</option>
                <option value="closed">停止</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
